[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriseal"
version = "0.1.1.dev0"
description = "Tamper-evident, independently-verifiable incident packages for robot/autonomy logs (MCAP)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kyle Mapue", email = "kyle@mapuekyle.com" }]
requires-python = ">=3.11"
keywords = ["mcap", "ros", "rosbag", "robotics", "tamper-evident", "integrity", "ed25519", "opentimestamps", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcap>=1.1.1",
    "cryptography>=42.0.0",
    "opentimestamps>=0.4.5",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Read ROS 1 .bag files directly (pure Python, no ROS install needed).
ros1 = ["rosbags>=0.9"]

[project.scripts]
veriseal = "veriseal.cli:app"

[project.urls]
Homepage = "https://github.com/kylemaps/veriseal"
Repository = "https://github.com/kylemaps/veriseal"

[tool.hatch.build.targets.sdist]
# Ship only the Python package sources + docs in the sdist. `only-include` is
# restrictive (a plain `include` is additive and still drags in the whole tree,
# e.g. veriseal-panel/node_modules — hundreds of MB). The TS panel is a separate
# sub-project, not part of the Python distribution. (pyproject.toml + PKG-INFO
# are added by hatchling automatically.)
only-include = [
    "src/veriseal",
    "web/verify.html",
    "tests",
    "docs",
    "README.md",
    "SPEC-manifest.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veriseal"]

# Bundle the standalone offline verifier into the wheel so `veriseal pack` can
# include it even when veriseal is pip-installed (the pack references it by name
# in its cover sheet, so it must always be present). Source of truth stays at
# web/verify.html; it is copied to veriseal/_assets/verify.html at build time.
[tool.hatch.build.targets.wheel.force-include]
"web/verify.html" = "veriseal/_assets/verify.html"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
