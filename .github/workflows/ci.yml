name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a PR from a branch in this repo, `push` and `pull_request` would otherwise
# both fire; cancel the superseded run so we don't pay for duplicate work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev group
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ros1]" --group dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Excludes tests marked "network" (live OpenTimestamps calendar calls),
      # which are non-deterministic on hosted runners. As of this writing no
      # test in the tree carries that marker — every anchor.submit/upgrade
      # call site is monkeypatched (see tests/test_anchor.py,
      # tests/test_anchor_upgrade.py) — but the filter and marker stay in
      # place so a future live-calendar test doesn't silently destabilize CI.
      - name: Test
        run: pytest -m "not network"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel and check metadata
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veriseal-panel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: veriseal-panel/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Verifies the panel's crypto core matches the Python reference, including
      # the RFC 6962 Merkle split-point regression (large-leaf fixture).
      - name: Test
        run: npm test

  # Manual-only: exercises tests marked "network" (real OpenTimestamps calendar
  # calls), kept off the push/PR critical path since calendar availability is
  # outside our control. Currently a no-op (nothing is marked "network" yet);
  # trigger via Actions -> CI -> Run workflow once a live-calendar test exists.
  network:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev group
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ros1]" --group dev

      - name: Test (network)
        run: pytest -m network
