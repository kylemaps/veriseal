name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .[ros1]

      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veriseal-panel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: veriseal-panel/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Verifies the panel's crypto core matches the Python reference, including
      # the RFC 6962 Merkle split-point regression (large-leaf fixture).
      - name: Test
        run: npm test
